name: Actualizar datos del dashboard

# Descarga el CSV desde vtex.brandlive.net y lo guarda en el repo (data/ops-om-ar.csv)
# para que el dashboard lo lea sin problemas de CORS.

on:
  # Cada 5 minutos (hora UTC). GitHub puede demorar unos minutos extra en horarios de mucha carga.
  schedule:
    - cron: "*/5 * * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions con el boton "Run workflow".
  workflow_dispatch:

# Permiso para que la Action pueda hacer commit del CSV al repo.
permissions:
  contents: write

# Evita que se solapen dos corridas al mismo tiempo.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  actualizar-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Descargar el CSV desde el servidor
        run: |
          mkdir -p data
          echo "Descargando CSV..."
          # -f: falla si el server responde error (4xx/5xx)
          # -S: muestra el error si algo sale mal
          # -L: sigue redirecciones
          # --retry: reintenta ante fallos de red transitorios
          curl -fSL --retry 3 --retry-delay 5 --max-time 120 \
            "https://vtex.brandlive.net/upload/queries/ops-om-ar.csv" \
            -o data/ops-om-ar.csv
          echo "Descarga OK. Tamano del archivo:"
          ls -lh data/ops-om-ar.csv

      - name: Validar que el CSV no este vacio
        run: |
          # Chequea que el archivo tenga al menos 2 lineas (header + 1 fila).
          LINES=$(wc -l < data/ops-om-ar.csv)
          echo "Lineas en el CSV: $LINES"
          if [ "$LINES" -lt 2 ]; then
            echo "ERROR: el CSV parece vacio o incompleto. No se hace commit."
            exit 1
          fi

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ops-om-ar.csv
          # Solo commitea si el archivo cambio respecto de la ultima version.
          if git diff --staged --quiet; then
            echo "Sin cambios en el CSV. Nada que commitear."
          else
            git commit -m "Actualizacion automatica de datos - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "CSV actualizado y publicado."
          fi
